<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DXF to PDF: a page selected in CAD. Yellow selection box and handles (CAD), a vector curve with
       control handles (DXF), a white page with an orange folded corner (PDF), on a teal cutting-mat tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad49a"/><stop offset=".55" stop-color="#0d8f8a"/><stop offset="1" stop-color="#0b3d6b"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff6a13"/>
    </linearGradient>
    <clipPath id="clip"><rect x="64" y="64" width="896" height="896" rx="210"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <path d="M192 64V960M320 64V960M448 64V960M576 64V960M704 64V960M832 64V960M64 192H960M64 320H960M64 448H960M64 576H960M64 704H960M64 832H960" stroke="#ffffff" stroke-opacity=".10" stroke-width="5" fill="none"/>
  </g>
  <g transform="rotate(-8 512 520)">
    <!-- shadow -->
    <path d="M310 272H612L742 402V832H310Z" fill="#06213d" fill-opacity=".35" transform="translate(22 26)"/>
    <!-- page with folded corner -->
    <path d="M300 250H602L732 380V810H300Z" fill="#ffffff"/>
    <path d="M602 250V380H732Z" fill="url(#fold)"/>
    <path d="M602 380H732L716 396H602Z" fill="#06213d" fill-opacity=".12"/>
    <!-- vector curve with its control handles -->
    <path d="M372 470L404 660M660 720L628 540" stroke="#0e2236" stroke-width="12" stroke-linecap="round"/>
    <path d="M372 470C404 660 628 540 660 720" fill="none" stroke="#0e2236" stroke-width="40" stroke-linecap="round"/>
    <circle cx="404" cy="660" r="19" fill="#0e2236"/>
    <circle cx="628" cy="540" r="19" fill="#0e2236"/>
    <rect x="344" y="442" width="56" height="56" rx="6" fill="#ff7a1a" stroke="#0e2236" stroke-width="9"/>
    <rect x="632" y="692" width="56" height="56" rx="6" fill="#ff7a1a" stroke="#0e2236" stroke-width="9"/>
    <!-- CAD selection box with corner handles -->
    <rect x="252" y="202" width="528" height="656" fill="none" stroke="#ffd23f" stroke-width="10" stroke-dasharray="30 20"/>
    <g fill="#ffd23f" stroke="#0e2236" stroke-width="8">
      <rect x="226" y="176" width="52" height="52" rx="7"/><rect x="754" y="176" width="52" height="52" rx="7"/>
      <rect x="226" y="832" width="52" height="52" rx="7"/><rect x="754" y="832" width="52" height="52" rx="7"/>
    </g>
  </g>
</svg>
