name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: End-to-end tests (real Electron app on a virtual display)
        run: xvfb-run -a npm run test:e2e
        env:
          SHOTS: e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # one installer for x64, 32-bit and ARM PCs, plus portable x64 and 32-bit
            cmd: dist:win
            files: dist/*.exe
          - os: ubuntu-latest    # AppImage and .deb for x64 and ARM64
            cmd: dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
          - os: macos-latest     # universal: Intel and Apple silicon
            cmd: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dxf-to-pdf-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
